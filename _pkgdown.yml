url: https://mcanzi.de/glasses3/

template:
  bootstrap: 5
  theme: a11y-dark
  bslib:
    bg: "#1e2830"
    fg: "#dfe6ea"
    primary: "#a9cbe0"
    secondary: "#98a8b3"
    link-color: "#f6b8a4"
    link-hover-color: "#a9cbe0"
    code-color: "#f2917a"
    border-color: "#34444f"
    navbar-bg: "#1e2830"
    base_font: "Atkinson Hyperlegible"
    heading_font: "Bricolage Grotesque"
    code_font: "JetBrains Mono"
  includes:
    in_header: <link rel="stylesheet" href="https://mcanzi.de/fonts/fonts.css">

navbar:
  structure:
    left: [intro, reference, news]
    right: [search, website, github]
  components:
    website:
      text: mcanzi.de
      href: https://mcanzi.de/
      aria-label: Massimiliano Canzi's website

reference:
- title: Reading recordings
  contents:
  - read_g3
  - read_g3_gaze
  - read_g3_imu
  - read_g3_events
  - read_g3_info
  - list_g3_recordings
- title: Events and epochs
  contents:
  - g3_syncport
  - g3_api_events
  - g3_add_syncport
  - g3_epochs
  - g3_pupil_long
- title: Processing
  contents:
  - g3_fill_gaps
  - g3_gaze_angles
  - g3_gaze_velocity
  - g3_add_clock_time
  - g3_downsample
- title: Plots
  contents:
  - plot_g3_pupil
  - plot_g3_gaze
  - theme_g3
- title: Example data
  contents:
  - g3_example
- title: Package
  contents:
  - glasses3-package
